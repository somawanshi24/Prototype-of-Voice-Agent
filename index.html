<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VocabVoice: a voice agent for learning words</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--tx:#23302b;--mu:#6b7770;--ac:#2f8f6b;--bd:#d9d7cf;--bad:#c0392b;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f1d;--card:#262c29;--tx:#e8ece9;--mu:#9aa7a0;--ac:#4fc29a;--bd:#3a423e;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#1b1f1d;--card:#262c29;--tx:#e8ece9;--mu:#9aa7a0;--ac:#4fc29a;--bd:#3a423e;--bad:#ff7b6b}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:20px}
main{width:100%;max-width:480px}
h1{font-size:22px;margin:0 0 4px}
p.sub{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px}
.word{font-size:32px;font-weight:700;margin:0}
.def{color:var(--mu);margin:6px 0 0}
.log{min-height:60px;max-height:200px;overflow:auto;font-size:15px}
.log div{margin:6px 0}
.bot{color:var(--ac)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;cursor:pointer}
button.main{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600;width:100%;padding:14px;font-size:17px}
button.main.on{background:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;margin-top:10px}
.row>*{flex:1}
input{font:inherit;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);min-width:0}
.score{color:var(--mu);font-size:14px;display:flex;justify-content:space-between;margin-bottom:8px}
.note{font-size:13px;color:var(--mu)}
</style></head><body><main>
<h1>VocabVoice</h1>
<p class="sub">Talk to learn new words. I say the meaning, you say the word.</p>
<div class="card">
  <div class="score"><span id="prog">Word 1 of 10</span><span id="score">Score: 0</span></div>
  <p class="word" id="clue">Tap Start</p>
  <p class="def" id="hint"></p>
</div>
<div class="card log" id="log" aria-live="polite"></div>
<button class="main" id="mic">Start session</button>
<div class="row"><button id="rep">Repeat</button><button id="hnt">Hint</button><button id="skp">Skip</button></div>
<div class="row"><input id="txt" placeholder="Or type your answer" autocomplete="off"><button id="go" style="flex:0">Go</button></div>
<p class="note" id="note"></p>
</main>
<script>
var W=[
["ephemeral","lasting for a very short time","Starts with E"],
["resilient","able to recover quickly after trouble","Starts with R"],
["meticulous","showing great attention to detail","Starts with M"],
["candid","honest and straightforward","Starts with C"],
["pragmatic","dealing with things in a practical way","Starts with P"],
["ambiguous","having more than one possible meaning","Starts with A"],
["diligent","hardworking and careful","Starts with D"],
["eloquent","fluent and persuasive in speaking","Starts with E"],
["scrutinize","examine very closely","Starts with S"],
["benevolent","kind and well meaning","Starts with B"]];
var i=0,score=0,tries=0,order=[],listening=false,rec=null,started=false;
var $=function(id){return document.getElementById(id)};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function say(t,cb){
  log(t,"bot");
  try{
    if(!window.speechSynthesis){if(cb)cb();return}
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.95;
    u.onend=function(){if(cb)cb()};u.onerror=function(){if(cb)cb()};
    speechSynthesis.speak(u);
  }catch(e){if(cb)cb()}
}
function log(t,c){var d=document.createElement("div");if(c)d.className=c;d.textContent=(c==="bot"?"Agent: ":"You: ")+t;$("log").appendChild(d);$("log").scrollTop=1e9}
function cur(){return W[order[i]]}
function ask(){
  if(i>=W.length){
    say("Session complete. You got "+score+" out of "+W.length+". Great work!");
    $("clue").textContent="Done!";$("hint").textContent="Score: "+score+" / "+W.length;$("mic").textContent="Restart";started=false;return;
  }
  tries=0;
  $("prog").textContent="Word "+(i+1)+" of "+W.length;
  $("clue").textContent="Which word means:";
  $("hint").textContent=cur()[1];
  say("Which word means: "+cur()[1]+"?",listen);
}
function listen(){
  if(!SR||listening||!started)return;
  try{
    rec=new SR();rec.lang="en-IN";rec.maxAlternatives=5;
    rec.onresult=function(e){
      var h=[];for(var k=0;k<e.results[0].length;k++)h.push(e.results[0][k].transcript);
      check(h.join(" "));
    };
    rec.onend=function(){listening=false;$("mic").classList.remove("on")};
    rec.onerror=function(){listening=false;$("mic").classList.remove("on")};
    rec.start();listening=true;$("mic").classList.add("on");$("mic").textContent="Listening… tap to stop";
  }catch(e){}
}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++){m[i]=[i]}for(j=0;j<=b.length;j++){m[0][j]=j}for(i=1;i<=a.length;i++){for(j=1;j<=b.length;j++){m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}}return m[a.length][b.length]}
function match(s,w){
  var parts=s.replace(/[^a-z ]/g," ").split(/\s+/);
  for(var k=0;k<parts.length;k++){
    var p=parts[k];if(!p)continue;
    if(p===w||p.indexOf(w)>-1)return true;
    if(p.length>=4&&p.slice(0,5)===w.slice(0,5))return true;
    if(lev(p,w)<=(w.length>=8?2:1))return true;
  }
  return false;
}
function check(said){
  if(!said.replace(/\s/g,"")){say("I did not catch that. Please say it again.",listen);return}
  log(said);
  var s=said.toLowerCase(),w=cur()[0];
  if(match(s,w)){
    score++;$("score").textContent="Score: "+score;
    say("Correct! "+w+" means "+cur()[1]+".",function(){i++;ask()});
  }else{
    tries++;
    if(tries>=2){say("Not quite. The answer is "+w+".",function(){i++;ask()})}
    else{say("Not quite. Hint: "+cur()[2]+". Try again.",listen)}
  }
}
function start(){
  speechSynthesis&&speechSynthesis.cancel();
  order=W.map(function(_,k){return k}).sort(function(){return Math.random()-.5});
  i=0;score=0;started=true;$("score").textContent="Score: 0";$("log").innerHTML="";
  say("Hi! Let's learn some words. I will say a meaning, and you say the word.",ask);
}
$("mic").onclick=function(){
  if(!started){start();return}
  if(listening){try{rec.stop()}catch(e){}return}
  listen();
};
$("rep").onclick=function(){if(started)say("Which word means: "+cur()[1]+"?",listen)};
$("hnt").onclick=function(){if(started)say("Hint: "+cur()[2],listen)};
$("skp").onclick=function(){if(started){say("The answer was "+cur()[0]+".",function(){i++;ask()})}};
function typed(){var v=$("txt").value.trim();if(v&&started){$("txt").value="";try{rec&&rec.abort()}catch(e){}check(v)}}
$("go").onclick=typed;
$("txt").onkeydown=function(e){if(e.key==="Enter")typed()};
if(!SR)$("note").textContent="Speech recognition is not supported in this browser. Use Chrome or Edge for voice input; typing works everywhere.";
else $("note").textContent="Allow microphone access when asked. Works best in Chrome or Edge.";
</script></body></html>
